name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  CI:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6
        with:
          node-version: '24.14.0'
          cache: 'npm'
      - run: npm ci
      - run: npm run cf-typegen
      - run: npm run test:coverage -- --passWithNoTests
      - name: Update Coverage Badge
        if: github.ref == 'refs/heads/main'
        run: node scripts/update-badge.mjs
      - name: Create Pull Request for Badge
        id: cpr
        if: github.ref == 'refs/heads/main'
        uses: peter-evans/create-pull-request@c0f553fe549906ede9cf27b5156039d195d2ece0 # v8
        with:
          token: ${{ secrets.AUTO_APPROVE_PAT }}
          commit-message: "docs: update coverage badge"
          title: "docs: update coverage badge"
          body: "Automated update of coverage badge in README.md from CI."
          branch: "docs/update-coverage-badge"
          base: "main"
          delete-branch: true
      - name: Enable Auto-Merge with Admin Override
        if: steps.cpr.outputs.pull-request-number
        run: |
          gh pr merge ${{ steps.cpr.outputs.pull-request-number }} --squash --admin
        env:
          GH_TOKEN: ${{ secrets.AUTO_APPROVE_PAT }}
